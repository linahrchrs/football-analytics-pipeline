name: football_analytics
version: "1.0.0"
config-version: 2
profile: football_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  football_analytics:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    predictions:
      # Built AFTER the Python model has run (step 4): dbt build --select tag:predictions
      +schema: marts
      +materialized: table
      +tags: ["predictions"]

seeds:
  football_analytics:
    +schema: seeds
    team_name_map:
      +column_types:
        api_team_id: integer
        confidence: numeric
