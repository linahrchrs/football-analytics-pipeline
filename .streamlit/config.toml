[theme]
base = "light"
primaryColor = "#0F5A57"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EDF2F1"
textColor = "#131719"
linkColor = "#0F5A57"
borderColor = "#D5DDDB"
baseRadius = "10px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap"

[theme.sidebar]
backgroundColor = "#0B1012"
secondaryBackgroundColor = "#16211F"
textColor = "#EEF4F3"
borderColor = "#22302F"
primaryColor = "#3CC2B6"

[server]
headless = true

[browser]
gatherUsageStats = false
